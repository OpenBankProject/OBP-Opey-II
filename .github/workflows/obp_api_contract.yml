name: OBP-API contract

on:
  pull_request:
  push:
    branches:
    - main

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test tools
        run: pip install pytest==8.3.5 pytest-asyncio==0.24.0
      - name: Check the OBP-API calls against the contract and the version floor
        run: python -m pytest test/test_obp_api_version.py test/test_obp_contract.py -q
